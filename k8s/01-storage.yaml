apiVersion: v1
kind: PersistentVolume
metadata:
  name: research-pv-239
spec:
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/id-239-research
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: research-pvc-239
  namespace: id-239
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: manual
  resources:
    requests:
      storage: 50Mi

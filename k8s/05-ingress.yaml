apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: id-239-ingress
  namespace: id-239
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "4m"
spec:
  ingressClassName: nginx
  rules:
    - host: www.id-239.com
      http:
        paths:
          - path: /about
            pathType: Prefix
            backend:
              service:
                name: svc-about
                port:
                  number: 80
          - path: /research
            pathType: Prefix
            backend:
              service:
                name: svc-research
                port:
                  number: 80
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: svc-api
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-about
                port:
                  number: 80
    - host: admin.id-239.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: svc-research
                port:
                  number: 80

apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-api
  namespace: id-239
  labels:
    app: app-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-api
  template:
    metadata:
      labels:
        app: app-api
    spec:
      containers:
        - name: python-api
          image: python:3.11-alpine
          command: ["python3", "/app/server.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: app-code
              mountPath: /app
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "150m"
              memory: "96Mi"
      volumes:
        - name: app-code
          configMap:
            name: app-api-code
---
apiVersion: v1
kind: Service
metadata:
  name: svc-api
  namespace: id-239
spec:
  type: ClusterIP
  selector:
    app: app-api
  ports:
    - port: 80
      targetPort: 8080

apiVersion: v1
kind: ConfigMap
metadata:
  name: app-about-nginx-conf
  namespace: id-239
data:
  default.conf: |
    server {
        listen 80;
        server_name _;

        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }

        location = /about {
            root /usr/share/nginx/html;
            try_files /about.html =404;
        }

        location = /about/ {
            root /usr/share/nginx/html;
            try_files /about.html =404;
        }

        location /about/ {
            alias /usr/share/nginx/html/;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-about
  namespace: id-239
  labels:
    app: app-about
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app-about
  template:
    metadata:
      labels:
        app: app-about
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: web-files
              mountPath: /usr/share/nginx/html
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
          resources:
            requests:
              cpu: "30m"
              memory: "32Mi"
            limits:
              cpu: "100m"
              memory: "64Mi"
      volumes:
        - name: web-files
          configMap:
            name: app-about-files
        - name: nginx-conf
          configMap:
            name: app-about-nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: svc-about
  namespace: id-239
spec:
  type: ClusterIP
  selector:
    app: app-about
  ports:
    - port: 80
      targetPort: 80
